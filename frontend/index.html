<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Цифровой Инспектор</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="header-flex">
            <div class="header-title-block">
                <h1>🛠 Цифровой Инспектор</h1>
                <p>Автоматическая проверка строительных документов</p>
            </div>
            <button id="chooseFileHeaderBtn" class="header-black-btn" style="display:none;">Выбрать PDF</button>
        </div>
    </header>

    <main>
        <!-- Секция загрузки PDF -->
        <section class="upload-section" id="centerFileSection">
            <form id="uploadForm">
                <input type="file" id="pdfFile" accept=".pdf" required hidden>
                <label for="pdfFile" class="custom-file" id="chooseFileLabel">
                    <span class="icon">📄</span> Выбрать PDF
                </label>
            </form>
        </section>

        <!-- Секция предпросмотра -->
        <section class="preview-section hidden">
            <div class="canvas-card">
                <canvas id="canvas"></canvas>
                <div class="page-controls">
                    <button id="prevPage">&larr; Предыдущая</button>
                    <span id="pageInfo">Страница 0 / 0</span>
                    <button id="nextPage">Следующая &rarr;</button>
                </div>
            </div>
            <div class="right-panel">
                <div id="selectedFileName" style="text-align:left;font-size:1.1rem;color:#e6eef6;margin-bottom:18px;"></div>
                <div class="stats">
                    <h3>Статистика обнаруженных объектов</h3>
                    <p><span class="color-box red small-box"></span>Подписи: <span id="countSign">0</span></p>
                    <p><span class="color-box blue small-box"></span>Печати/Штампы: <span id="countStamp">0</span></p>
                    <p><span class="color-box green small-box"></span>QR-коды: <span id="countQR">0</span></p>
                    <div class="buttons">
                        <button id="downloadJSON">Скачать JSON</button>
                        <button id="downloadImagesZip">Скачать архив изображений</button>
                    </div>
                </div>
            </div>
        </section>

        <div class="json-card hidden" style="max-width:1120px;margin:32px auto 0 auto;width:100%;">
            <h3>Предпросмотр JSON</h3>
            <pre id="jsonPreview">{}</pre>
        </div>
    </main>

    <footer>
        <p>Digital Inspector © 2025 | Команда Grego</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
